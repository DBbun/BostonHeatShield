<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HeatShield Facilitator Board</title>
<meta name="description" content="Facilitator board for the Boston HeatShield online Round 1. Runs in your browser; nothing is sent anywhere.">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--dim:#6e6e73;--line:#e3e3e8;--fill:#efeff4;--acc:#0071e3;--acc-t:#e8f1fd;
  --ok:#248a3d;--ok-t:#fff;--watch:#ffcc00;--watch-t:#000;--crit:#d70015;--crit-t:#fff;--blur:rgba(245,245,247,.8);
  --sh:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);--r:18px;--tab:60px;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--dim:#a1a1a6;--line:#2c2c2e;--fill:#2c2c2e;--acc:#0a84ff;--acc-t:#0a2a4a;
  --ok:#30d158;--ok-t:#000;--crit:#ff453a;--crit-t:#000;--blur:rgba(0,0,0,.75);--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html.large{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ico{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:1.1rem;height:1.1rem}

/* header: timer */
.top{position:sticky;top:0;z-index:5;background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:720px;margin:0 auto;padding:8px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brandbtn{background:none;border:0;padding:4px 0;text-align:left;min-height:44px}
.brandbtn b{display:block;font-size:1.1rem;letter-spacing:-.01em}
.brandbtn small{display:block;font-size:.72rem;color:var(--dim)}
.timer{display:flex;align-items:center;gap:2px}
.rb{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--dim);font-size:1.5rem;line-height:1;display:grid;place-items:center}
.big{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.6ch;text-align:center;letter-spacing:-.02em}
.big.over{color:var(--crit)}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;margin-left:6px}
.play .ico{fill:currentColor;stroke:none}
.subrow{max-width:720px;margin:0 auto;padding:0 16px 6px;display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:var(--dim)}
#blkName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#totTime{white-space:nowrap;font-variant-numeric:tabular-nums}
.prog{max-width:720px;margin:0 auto;padding:0 16px 8px;display:flex;gap:3px}
.prog i{display:block;height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog i b{display:block;height:100%;width:0;border-radius:3px}
.prog i.cur{height:7px;margin-top:-1px}

/* page */
.wrap{max-width:720px;margin:0 auto;padding:12px 16px calc(var(--tab) + 110px + env(safe-area-inset-bottom));outline:0}
.title{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:.2em 0 .15em}
.kick{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--fill);color:var(--dim);border-radius:999px;padding:.15em .7em;font-size:.78rem;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap}
.sub{color:var(--dim);margin:0 0 .9rem;font-size:1.02rem}
h3.sec{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin:1.4rem 4px .5rem}

/* cards, lists */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 0 12px;box-shadow:var(--sh)}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;background:none;border:0;text-align:left}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600}
.row .rt small{display:block;color:var(--dim);font-size:.85rem}
.row .ico:last-child{color:var(--dim);width:1.1rem;height:1.1rem}
.ri{width:36px;height:36px;border-radius:10px;background:var(--acc-t);color:var(--acc);display:grid;place-items:center;flex:none}
details.disc>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 16px;cursor:pointer;font-weight:600}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary span{flex:1}
details.disc>summary em{font-style:normal;color:var(--dim);font-weight:500;font-size:.9rem}
details.disc>summary .ico{width:1.1rem;height:1.1rem;color:var(--dim);transition:transform .2s}
details.disc[open]>summary .ico{transform:rotate(90deg)}
.dbody{padding:0 16px 14px}
.dbody ul{margin:0;padding-left:1.2rem}
.dbody li{margin:.35em 0}
.dbody small{display:block;color:var(--dim)}

/* read aloud */
.read{background:var(--acc-t);border:0}
.read .k{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.read .q{margin:0;font-size:1.12rem;line-height:1.45}
.read .q.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:8px 0 0;min-height:36px}
.ask ol{margin:0;padding-left:1.4rem}
.ask li{font-size:1.08rem;margin:.5em 0;padding-left:.2em}
.ask li::marker{color:var(--acc);font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);margin:0;flex:none;display:grid;place-items:center;background:none}
.chk input:checked{background:var(--acc);border-color:var(--acc)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked+span{color:var(--dim);text-decoration:line-through}

/* step dots */
.dots{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 12px;margin:0 -4px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:none;color:var(--c);font-weight:700;display:grid;place-items:center;padding:0}
.dot.done{background:var(--c);color:#fff}
.dot.cur{background:var(--c);color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.dot .ico{width:1rem;height:1rem;stroke-width:3}

/* buttons, segmented, forms */
.btn{white-space:nowrap;min-height:48px;border-radius:14px;border:0;background:var(--fill);color:var(--acc);font-weight:600;padding:0 18px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.pri{background:var(--acc);color:#fff}
.btn.grow{flex:1}
.dock .btn{padding:0 14px}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:default}
.dock{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;margin-top:16px;padding:8px;border-radius:22px;background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 2px 16px rgba(0,0,0,.14);z-index:3}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;overflow-x:auto;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:8px;min-height:36px;padding:0 12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.seg button[aria-selected=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg button:disabled{opacity:.35}
.field{margin:0 0 12px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin:0 4px 4px}
input[type=text],select,textarea{width:100%;border:0;border-radius:12px;background:var(--fill);padding:12px;font-size:1rem}
textarea{min-height:5.2rem;resize:vertical}
.sw{width:51px;height:31px;border-radius:999px;border:0;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.empty{text-align:center;color:var(--dim);padding:28px 16px}
.empty b{display:block;font-size:2rem;margin-bottom:4px}
.pill{background:var(--acc-t);color:var(--acc);border-radius:999px;padding:.1em .65em;font-size:.78rem;font-weight:700}
.ent{margin:0 0 12px}
.ent .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--dim);font-size:.8rem}
.ent .main{font-size:1.1rem;font-weight:600;margin:.3em 0}
.ent dl{margin:.4em 0 0;font-size:.9rem}
.ent dt{display:inline;color:var(--dim);font-weight:600}
.ent dd{display:inline;margin:0}
.ent dd::after{content:"";display:block}

/* listen */
.listen{margin:0 0 12px}
.lbtn{display:inline-flex;gap:6px;align-items:center;background:var(--fill);border:0;color:var(--acc);font-weight:600;border-radius:999px;min-height:36px;padding:0 14px 0 10px;font-size:.9rem}
.lbtn .ico{width:1.2rem;height:1.2rem}
.lbtn[aria-expanded=true]{background:var(--acc);color:#fff}
.lbox{background:var(--card);border-radius:14px;padding:12px;margin-top:8px;box-shadow:var(--sh)}
.lbox[hidden]{display:none}
.lbox audio{width:100%}
.lbox .note{font-size:.75rem;color:var(--dim);margin:6px 0 0}
.lbox summary{cursor:pointer;font-weight:600;color:var(--acc);margin-top:8px;font-size:.9rem}
.lbox .words{white-space:pre-line;margin-top:6px;font-size:.95rem}

/* risk board */
.risk{width:100%;border-collapse:separate;border-spacing:0 6px;table-layout:fixed}
.risk th{font-size:.7rem;font-weight:700;color:var(--dim);text-align:center;letter-spacing:.03em}
.risk th.rowh{text-align:left;font-size:.85rem;color:var(--ink);padding-right:12px;width:27%;line-height:1.2}
.risk td{text-align:center}
.cell{width:40px;height:40px;max-width:100%;border-radius:50%;border:2px solid var(--line);background:none;font-weight:800;font-size:1.05rem;color:var(--dim);display:inline-grid;place-items:center;padding:0}
.s1{background:var(--ok);border-color:var(--ok);color:var(--ok-t)}
.s2{background:var(--watch);border-color:var(--watch);color:var(--watch-t)}
.s3{background:var(--crit);border-color:var(--crit);color:var(--crit-t)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--dim);margin:4px 4px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:22px;height:22px;font-size:.7rem;border-width:1.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{min-height:40px;font-size:.9rem}

/* tab bar, sheet, toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabin{max-width:560px;margin:0 auto;display:flex}
.tabin button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:var(--tab);padding:7px 0 4px;border:0;background:none;color:var(--dim);font-size:.7rem;font-weight:600}
.tabin button[aria-selected=true]{color:var(--acc)}
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:min(560px,100%);max-height:88vh;margin:auto auto 0;border-radius:22px 22px 0 0;box-shadow:0 -4px 40px rgba(0,0,0,.3)}
@media(min-width:640px){dialog{margin:auto;border-radius:22px}}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sin{padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sin h2{font-size:1.5rem;margin:.2em 0 .4em;letter-spacing:-.01em}
.sin p{margin:.5em 0}
.sin .big-text{font-size:1.25rem;line-height:1.5}
.sin .fine{font-size:.82rem;color:var(--dim)}
.sin a{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 80px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(40,40,44,.95);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9;font-size:.9rem;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.tabbar,.dock,.listen,.toast,.noprint{display:none!important}body{background:#fff;color:#000}.card,.list{box-shadow:none;border:1px solid #000;break-inside:avoid}.read{background:#fff}details.disc>.dbody{display:block}.wrap{padding-bottom:0}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <button class="brandbtn" id="aboutBtn" aria-label="About this board"><b>HeatShield</b><small>Fictional · simulated data</small></button>
    <div class="timer" role="group" aria-label="Timer">
      <button class="rb" id="prevBlk" aria-label="Previous block">‹</button>
      <span class="big" id="blkTime" role="timer">0:00</span>
      <button class="rb" id="nextBlk" aria-label="Next block">›</button>
      <button class="play" id="runBtn" aria-label="Start timer"></button>
    </div>
  </div>
  <div class="subrow"><span id="blkName"></span><span id="totTime"></span></div>
  <div class="prog" id="prog" aria-hidden="true"></div>
</header>
<main class="wrap" id="panel" tabindex="-1"></main>
<nav class="tabbar" aria-label="Sections"><div class="tabin" id="tabs" role="tablist"></div></nav>
<dialog id="sheet" aria-label="Details"></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="audio/narration.js"></script>
<script>
(() => {
'use strict';

/* ---------- content (adapted from the Situation Manual and the Round 1 run sheet) ---------- */
const BLOCKS = [
  { name: 'Welcome', mins: 5 },
  { name: 'Module 1: Outlook and Preparedness', mins: 10 },
  { name: 'Module 2: Heat Emergency and Power Stress', mins: 28 },
  { name: 'Module 3: Recovery and Resilience', mins: 10 },
  { name: 'Hotwash and close', mins: 7 },
];
const NEIGH = ['Roxbury', 'East Boston', 'Chinatown', 'Dorchester', 'Citywide cooling sites'];
const COLS = ['Daytime heat', 'Overnight recovery', 'Cooling access and power', 'EMS and language need', 'Outreach status'];
const STATUS = ['—', 'OK', 'Watch', 'Critical'];
const SNAPS = [['m1', 'After Module 1'], ['mid', 'After Inject 2.2'], ['m3', 'After Module 3']];
const CATS = ['Immediate fix', '30 days', '60 days', '90 days', 'Long-term investment'];

const ENVELOPES = [
  { id: 1, role: 'Public health', share: 'Share at Inject 2.1', text: 'Preliminary syndromic surveillance and 911 call notes show a sharp increase in heat-related symptoms in two environmental justice neighborhoods. A home health provider also reports questions about insulin and temperature-sensitive medication after several hours without reliable refrigeration. Data are preliminary and not yet cleared for public release.', forces: 'What health data can be shared, with whom, how quickly, and how it changes cooling-center operations.' },
  { id: 2, role: 'Utility liaison', share: 'Share at Inject 2.2', text: 'A feeder serving parts of a heat hotspot is under stress. The utility cannot yet provide a restoration or stabilization time. Load reduction may be requested, but public messaging must avoid panic.', forces: 'Coordination between utility information, emergency management, and medical-device continuity.' },
  { id: 3, role: 'Community organization', share: 'Share at Inject 2.6', text: 'Residents are reporting that official heat messages are not reaching some older adults, renters, people with limited English proficiency, and residents without reliable phone or internet access.', forces: 'How community reports are elevated, who updates multilingual messaging, and how trusted messengers are activated.' },
  { id: 4, role: 'Housing or property manager', share: 'Optional. Share at Inject 2.2 if someone holds this role', text: 'A multifamily building reports high indoor temperatures, unreliable elevators, and several mobility-impaired residents above the eighth floor. The building has limited staff on site and no clear protocol.', forces: 'Who can request welfare checks, how building information is verified, and what support is needed.' },
  { id: 5, role: 'Transportation or paratransit', share: 'Share at Inject 2.5', text: 'Requests for rides to cooling locations and medical appointments exceed available accessible vehicle capacity. Some cooling sites are open but difficult to reach safely during peak afternoon heat.', forces: 'Prioritize trips and coordinate with community groups.' },
];
const PERSONAS = [
  { title: 'An older adult in a high-rise', text: 'You live alone on the ninth floor. The elevator works only sometimes. The heat in your apartment has not dropped for three nights. You are not sure which cooling site is open or how to get there.' },
  { title: 'A resident who is unhoused', text: 'You spend the day outdoors. Official cooling centers have rules about bags and pets, and the nearest one is far. You have heard the rules might change but not where to check.' },
  { title: 'A cooling-site operator', text: 'Your site is over capacity. Your staff are tired, your backup power is untested, and your site is not accessible for wheelchairs by the side entrance.' },
  { title: 'A utility liaison', text: 'You know a feeder is under stress but cannot say when it will stabilize. You are worried that a public message will cause panic or be taken as a promise.' },
  { title: 'A community health worker', text: 'Your clients trust you more than any official alert. They ask you what is true. You hear things in the community that never reach official briefings.' },
];
const RULES = [
  'This is a no-fault, low-stress exercise. Different views and disagreement are expected and useful.',
  'Respond using what you know about current plans and what exists today. Do not assume unlimited staff, vehicles, translators, shelter space, power or cooling-center capacity.',
  'Decisions here are not precedent-setting and do not reflect anyone\'s organization.',
  'Pair every problem with a suggested action, an owner and a realistic next step.',
  'Lived experience counts as operational information, not as background.',
  'Quieter voices are invited in, and community voices are not crowded out by technical ones.',
  'Please do not share private health details or confidential information.',
];
const FACIL = [
  ['Every decision needs an owner.', 'Who has authority to act, and who supports?'],
  ['Every action needs a trigger.', 'What data or threshold tells you to move from monitoring to action?'],
  ['Every neighborhood comparison needs an equity check.', 'Who benefits, who might be missed, and how would anyone know?'],
  ['Every resource assumption needs a backup.', 'What if the preferred site, staff, vehicle, translator or power source is not available?'],
  ['Every unresolved gap becomes an improvement item.', 'Is it an immediate fix, a 30/60/90-day action, or a long-term investment?'],
];
const STEPS = [
  { id: 'W', block: 0, mins: 5, title: 'Welcome and ground rules', kind: 'Welcome', kick: 'Start',
    read: '"Thank you for coming. I\'m Uri Kartoun, founder of DBbun LLC in Cambridge. This is a free, voluntary round of Boston HeatShield, a heat wave exercise that won NOAA and NIHHIS\'s 2026 Heat Tabletop Design Challenge. It is a fictional scenario with simulated numbers. It is not an official NOAA, NIHHIS or City of Boston project, and I run it on my own. For the next hour you each have a role. You will move through a heat wave in three steps: the days before it, the worst day, and the recovery. At each step you will get news, and the group decides together what to do and who does it. I write down decisions by role, not by name, and I am not recording this call. Please do not share private health details or confidential information. Nobody is graded, and there are no wrong answers. When it\'s over I\'ll send everyone a short written summary. Any questions before we start?"',
    list: ['Rules', RULES], extra: 'Scenario in one minute: A simulated near-future heat wave hits Boston from Thursday to Monday in late July, based on a modeled hot week in 2019. Daytime highs reach the upper 90s to low 100s. Overnight lows stay above 78 to 82 degrees in many areas. Dense neighborhoods with lots of pavement and few trees stay hottest. By Day 4, heavy cooling demand puts localized stress on the power grid. It is not a citywide blackout, but several buildings, cooling sites and medically vulnerable residents are affected. All numbers are simulated.',
    todo: ['Check that captions are on and recording is off.', 'Confirm each person\'s role. Fill empty roles by reading the envelope aloud.'] },
  { id: '1.1', block: 1, mins: 10, title: 'Inject 1.1: 7-day forecast signal', kind: 'Module 1',
    read: '"It is Thursday morning, seven days before the expected peak. Forecast confidence is rising. Several agencies get an update that dangerous heat and warm nights are likely next weekend. No formal emergency has been declared."',
    questions: ['Do you act now or wait?', 'What forecast threshold triggers cooling-site readiness, outreach, staffing checks and partner calls?', 'Who sends the first coordinated message, and how does it reach people without internet, people who speak other languages, older adults living alone, and people who are unhoused?'],
    prompts: ['Push for concrete triggers, not general intent: who acts first, who has authority, who receives the message?', 'Ask what changes if the formal heat threshold has not yet been met.', 'Treat community reports as actionable, not as background.'],
    todo: ['Fill the first two risk-board columns (daytime heat, overnight recovery).', 'Save a risk-board snapshot: After Module 1.'] },
  { id: '2.0', block: 2, mins: 2, title: 'Module 2: Set the scene (Day 4)', kind: 'Module 2',
    read: '"It is Sunday afternoon, Day 4 of the heat wave. Daytime heat has been severe for days and nights have stayed dangerously warm. Cooling-center attendance is up. EMS and urgent care are seeing more heat-related calls. The utility reports localized power stress and asks for conservation in some neighborhoods."',
    extra: 'Data reveals (simulated, say so): 3 PM board shows very high daytime heat, with a modeled maximum of 104.5 degrees F. 3 AM board shows poor overnight recovery, with about 87 percent of modeled areas above the 36-hour heat-duration threshold. Power stress overlay shows a heat island intensity of about 11 degrees F in the densest, least-shaded areas.',
    prompts: ['For every "should", ask who owns it, what authority they use, what data triggers it, and what happens if the preferred resource is not available.'] },
  { id: '2.1', block: 2, mins: 4, title: 'Inject 2.1: Competing authority', kind: 'Module 2', envelope: 1,

    onclick: ev => { catPick = i; seg.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-selected', String(j === i))); } }, CATSHORT[i])));
  p.append(h('div', { class: 'card' }, seg, field('Action', act),
    h('div', { class: 'list', style: 'box-shadow:none;background:var(--fill);border-radius:14px' }, disc('Add details', 'optional', field('Owner (role)', own), field('Equity impact and dependencies', eq))),
    h('div', { class: 'actions' }, h('button', { class: 'btn pri grow', onclick: () => {
      if (!act.value.trim()) { toast('Add an action first'); return; }
      S.improv.push({ cat: CATS[catPick], action: act.value.trim(), owner: own.value.trim(), equity: eq.value.trim() }); save(); render(); toast('Added'); } }, 'Add to plan'))));
  let any = false;
  CATS.forEach((c, ci) => {
    const items = S.improv.map((x, i) => [x, i]).filter(([x]) => x.cat === c); if (!items.length) return; any = true;
    p.append(h('h3', { class: 'sec' }, c), h('div', { class: 'list' }, items.map(([x, i]) => h('div', { class: 'dbody', style: 'padding-top:12px' },
      h('div', { style: 'font-weight:600' }, x.action),
      x.owner ? h('small', {}, 'Owner: ' + x.owner) : null, x.equity ? h('small', {}, x.equity) : null,
      h('button', { class: 'btn sm danger noprint', style: 'margin-top:8px', 'aria-label': 'Delete item', onclick: () => { S.improv.splice(i, 1); save(); render(); } }, 'Delete')))));
  });
  if (!any) p.append(h('div', { class: 'empty' }, h('b', {}, '🚩'), 'Plan items will show up here.'));
}

/* ---------- Cards ---------- */
function cardSheet(kick, title, text, forces, copyText, copyMsg) {
  openSheet(h('div', { class: 'kick', style: 'color:var(--acc)' }, kick), h('h2', {}, title), h('p', { class: 'big-text' }, text),
    forces ? h('p', { class: 'fine' }, 'Decision forced: ' + forces) : null,
    h('div', { class: 'actions' }, h('button', { class: 'btn pri grow', onclick: () => copy(copyText, copyMsg) }, 'Copy message')));
}
const envCopy = e => `Role card (fictional exercise): ${e.role}\n\n${e.text}\n\nFor this round only. Please keep it private until the facilitator asks you to share.`;
function viewCards(p) {
  p.append(...head('Cards', 'Tap a card to open it. Fictional content.', 'tab_cards'));
  p.append(h('h3', { class: 'sec' }, 'Role envelopes'), h('div', { class: 'list' }, ENVELOPES.map(e =>
    h('button', { class: 'row', onclick: () => cardSheet(e.share, `Envelope ${e.id}: ${e.role}`, e.text, e.forces, envCopy(e), 'Copied: Envelope ' + e.id) },
      h('span', { class: 'ri', style: 'font-weight:700' }, String(e.id)), h('span', { class: 'rt' }, h('b', {}, e.role), h('small', {}, e.share.replace(/^Optional\. /, ''))), ico('chev')))));
  const persona = x => cardSheet('Persona card', x.title, x.text, null, x.title + '\n\n' + x.text, 'Copied persona');
  p.append(h('h3', { class: 'sec' }, 'Persona cards'),
    h('div', { class: 'actions' }, h('button', { class: 'btn pri grow', onclick: () => persona(PERSONAS[Math.floor(Math.random() * PERSONAS.length)]) }, 'Draw a random card')),
    h('div', { class: 'list' }, PERSONAS.map(x => h('button', { class: 'row', onclick: () => persona(x) }, h('span', { class: 'rt' }, h('b', {}, x.title)), ico('chev')))));
}

/* ---------- Notes and export ---------- */
const HOT = ['What worked well and should be kept?', 'Where did the response depend on people knowing each other instead of on a written protocol?', 'What was missing from the shared picture of the situation?', 'What is the one thing to fix before the next real heat wave?'];
function exportText() {
  const d = new Date(), L = [];
  const gridTxt = g => NEIGH.map((n, r) => `  ${n}: ` + COLS.map((c, k) => `${c} = ${STATUS[g[r][k]]}`).join('; ')).join('\n');
  L.push('BOSTON HEATSHIELD ONLINE ROUND 1: NOTES', 'Fictional exercise. All numbers are simulated. Not an official NOAA, NIHHIS or City of Boston product.', 'Notes are by role, not by name.', `Date: ${d.toLocaleDateString()}`, '');
  L.push('TIME USED PER BLOCK'); BLOCKS.forEach((b, i) => L.push(`  ${b.name}: ${mmss(S.spent[i])} of ${b.mins}:00`));
  L.push('', 'RISK BOARD (current)', gridTxt(S.risk));
  SNAPS.forEach(([k, l]) => { if (S.snaps[k]) L.push('', 'RISK BOARD SNAPSHOT: ' + l, gridTxt(S.snaps[k].grid)); });
  L.push('', 'DECISION LOG'); if (!S.log.length) L.push('  (none)');
  S.log.forEach((e, i) => L.push(`  ${i + 1}. [${e.step}] Decision: ${e.decision || '-'}`, `     Trigger and data: ${e.trigger || '-'}`, `     Lead: ${e.lead || '-'}; Partners: ${e.partners || '-'}`, `     Equity check: ${e.equity || '-'}`, `     Data gap and improvement item: ${e.gap || '-'}`));
  L.push('', 'IMPROVEMENT PLAN'); if (!S.improv.length) L.push('  (none)');
  CATS.forEach(c => { const it = S.improv.filter(x => x.cat === c); if (it.length) { L.push('  ' + c); it.forEach(x => L.push(`    - ${x.action}` + (x.owner ? ` | Owner: ${x.owner}` : '') + (x.equity ? ` | Equity and dependencies: ${x.equity}` : ''))); } });
  L.push('', 'HOTWASH'); HOT.forEach((q, i) => L.push(`  ${q}`, `    ${S.hot[i] || '-'}`));
  L.push('', 'FACILITATOR NOTES', '  ' + (S.notes || '-'), '', 'Generated by the HeatShield Facilitator Board (DBbun LLC). Drafted with Claude Code (model claude-sonnet-5-5).');
  return L.join('\n');
}
function viewNotes(p) {
  p.append(...head('Notes', 'Saved only in this browser.', 'tab_notes'));
  p.append(h('h3', { class: 'sec' }, 'Hotwash'), h('div', { class: 'list' }, HOT.map((q, i) => {
    const ta = h('textarea', { id: 'hot' + i, 'aria-label': q }); ta.value = S.hot[i] || '';
    const tick = h('em', {}, '✓'); tick.hidden = !ta.value.trim();
    ta.oninput = () => { S.hot[i] = ta.value; tick.hidden = !ta.value.trim(); save(); };
    return h('details', { class: 'disc' }, h('summary', {}, h('span', {}, q), tick, ico('chev')), h('div', { class: 'dbody' }, ta)); })));
  const n = h('textarea', { id: 'notes', style: 'min-height:8rem' }); n.value = S.notes; n.oninput = () => { S.notes = n.value; save(); };
  p.append(h('h3', { class: 'sec' }, 'Your notes'), h('div', { class: 'card' }, h('div', { class: 'field', style: 'margin:0' }, h('label', { for: 'notes' }, 'Facilitator notes'), n)));
  const sw = h('button', { class: 'sw', role: 'switch', 'aria-checked': String(!!S.large), 'aria-label': 'Large text', onclick: () => { S.large = !S.large; sw.setAttribute('aria-checked', String(S.large)); document.documentElement.classList.toggle('large', S.large); save(); } });
  const item = (label, fn, cls = '') => h('button', { class: 'row ' + cls, onclick: fn }, h('span', { class: 'rt' }, h('b', { style: cls ? 'color:var(--crit)' : 'color:var(--acc)' }, label)));
  p.append(h('h3', { class: 'sec noprint' }, 'Export'), h('div', { class: 'list noprint' },
    item('Download notes (.txt)', () => {
      const blob = new Blob([exportText()], { type: 'text/plain;charset=utf-8' }), a = h('a', { href: URL.createObjectURL(blob), download: `HeatShield_Round1_notes_${new Date().toISOString().slice(0, 10)}.txt` });
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Notes saved to your downloads'); }),
    item('Copy notes', () => copy(exportText(), 'Notes copied')),
    item('Print', () => window.print()),
    h('div', { class: 'row' }, h('span', { class: 'rt' }, h('b', {}, 'Large text')), sw),
    item('Clear all data', () => { if (confirm('Clear ALL notes, the board, the log and the timers from this browser? This cannot be undone.')) { S = fresh(); running = false; document.documentElement.classList.remove('large'); save(); paintClock(); paintTabs(); render(); toast('Cleared'); } }, 'danger')));
  p.append(h('p', { class: 'fine', style: 'color:var(--dim);font-size:.82rem;padding:0 4px' }, 'On a shared computer, clear all data when you are done. Download first.'));
}

document.documentElement.classList.toggle('large', !!S.large);
paintClock(); paintTabs(); render();
})();
